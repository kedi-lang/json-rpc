# The Python environment of the fast_agent Kedi package. `environment: uv` installs it from
# uv.lock into the installed package's .kedi-env/; nothing goes into the Python running Kedi.
# The bridge and the Python bridge SDK are files of the package, not dependencies.
[project]
name = "kedi-fast-agent-environment"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = ["fast-agent-mcp==0.10.69"]

[tool.uv]
package = false
