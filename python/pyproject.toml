[project]
name = "kedi-bridge"
version = "0.1.0"
description = "Write Kedi JSON-RPC bridges in Python: the protocol, its checks and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Mert Sırakaya"},
    {name = "Doğukan Yiğit Polat"},
    {email = "mert@kedi-lang.org"},
    {email = "yigit@neurograph.net"},
]
# Standard library only: a bridge installs the SDK beside its harness's pinned dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/kedi-lang/json-rpc"
Specification = "https://github.com/kedi-lang/json-rpc/blob/main/spec/protocol.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_bridge"]
