name: ts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - name: The embedded fixtures match fixtures/v1
        run: node scripts/generate-fixtures.ts --check
      - run: npm test
      - name: The example passes its preflight
        run: node examples/chat.ts --check
      - name: The example passes the fixtures over stdio, every frame checked against the schema
        run: |
          python -m pip install "jsonschema==4.26.0"
          python ../../testing/fake_kedi.py --bridge "node examples/chat.ts" ../../fixtures/v1/*.json

  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm ci
        working-directory: ts/sdk
      - run: npm run check
      - run: npm test
      - name: The pi bridge passes its preflight
        run: node bridge.ts --check
      - name: The bundled bridge runs alone, with only Node
        run: |
          npm run build
          lone="$(mktemp -d)"
          cp dist/bridge.mjs "$lone/"
          node "$lone/bridge.mjs" --check
      - name: The pi bridge passes the fixtures over stdio, every frame checked against the schema
        run: |
          python -m pip install "jsonschema==4.26.0"
          python ../../testing/fake_kedi.py --bridge "node bridge.ts" ../../fixtures/v1/*.json
