name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The embedded fixtures match fixtures/v1
        run: python scripts/sync_fixtures.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src:tests
      - name: The example passes its preflight
        run: python examples/chat.py --check
        env:
          PYTHONPATH: src
      - name: The example passes the fixtures over stdio, every frame checked against the schema
        run: |
          python -m pip install "jsonschema==4.26.0"
          python ../testing/fake_kedi.py --bridge "python examples/chat.py" ../fixtures/v1/*.json
        env:
          PYTHONPATH: src
          KEDI_BRIDGE_PREFLIGHT: "off"

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.4
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hermes v0.23.4 from its lockfile
        working-directory: hermes-agent
        run: uv sync --frozen --no-dev --python 3.14
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/hermes-venv
      - name: Real mode against a stub upstream, every request on the wire admitted
        working-directory: python/hermes
        run: ${{ github.workspace }}/hermes-venv/bin/python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}/python/hermes
      - name: The Hermes bridge passes its preflight
        working-directory: python/hermes
        run: ${{ github.workspace }}/hermes-venv/bin/python bridge.py --check
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
      - name: The Hermes bridge passes the fixtures over stdio, every frame checked against the schema
        run: |
          python -m pip install "jsonschema==4.26.0"
          python testing/fake_kedi.py --bridge "${{ github.workspace }}/hermes-venv/bin/python python/hermes/bridge.py" fixtures/v1/*.json
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          KEDI_BRIDGE_PREFLIGHT: "off"
      - name: The Hermes package names the commit tested here
        run: |
          tested="$(git -C hermes-agent rev-parse HEAD)"
          grep -qxF "      environment_project: git+https://github.com/NousResearch/hermes-agent@$tested" packages/hermes/package.kedi || {
            echo "::error::packages/hermes/package.kedi does not name Hermes $tested, the commit tested here"; exit 1; }
      - name: The assembled Hermes package passes the preflight
        run: |
          packages/hermes/assemble.sh
          ${{ github.workspace }}/hermes-venv/bin/python packages/hermes/src/hermes/bridge.py --check
